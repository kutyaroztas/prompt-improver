<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Prompt Improver Ayarları</title>
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f9faeb;
      color: #1a1a1a;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #6f42c1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .checkbox-group input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
    }
    .flex-row {
      display: flex;
      gap: 6px;
    }
    .btn-secondary {
      width: auto;
      background-color: #4a5568;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-secondary:hover {
      background-color: #2d3748;
    }
    button.btn-primary {
      width: 100%;
      background-color: #6f42c1;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      margin-top: 10px;
    }
    button.btn-primary:hover {
      background-color: #5a32a3;
    }
    .shortcut-info {
      background-color: #e9ecef;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #495057;
      margin-top: 10px;
      text-align: center;
    }
    .shortcut-info kbd {
      background-color: #ffffff;
      border: 1px solid #adb5bd;
      border-radius: 3px;
      padding: 2px 4px;
      font-weight: bold;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>✨ Prompt Improver v1.6</h2>
  
  <div class="form-group">
    <label for="provider">LLM Provider Seçimi:</label>
    <select id="provider">
      <option value="llama">Local LLM (llama-server)</option>
      <option value="openai">OpenAI (ChatGPT)</option>
      <option value="claude">Anthropic (Claude)</option>
      <option value="gemini">Google (Gemini)</option>
    </select>
  </div>

  <!-- Local LLM Settings -->
  <div id="local-settings" class="form-group">
    <label for="llamaUrl">Local LLM Endpoint URL:</label>
    <input type="text" id="llamaUrl" placeholder="http://127.0.0.1:8080/v1/chat/completions">
    
    <label for="modelsUrl" style="margin-top: 8px;">Models Endpoint URL:</label>
    <div class="flex-row">
      <input type="text" id="modelsUrl" placeholder="http://127.0.0.1:8081/v1/models">
      <button id="fetchLocalModelsBtn" class="btn-secondary" type="button">Çek</button>
    </div>

    <label for="localModelSelect" style="margin-top: 8px;">Seçili Local Model:</label>
    <select id="localModelSelect">
      <option value="">-- Modelleri Çekin veya Seçin --</option>
    </select>
  </div>

  <!-- Cloud API Settings -->
  <div id="api-settings" class="form-group hidden">
    <label for="apiKey">API Key:</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    
    <label for="modelSelect" style="margin-top: 8px;">Model Seçimi / İsmi:</label>
    <div class="flex-row">
      <select id="modelSelect">
        <option value="">-- Modelleri Çekin veya Seçin --</option>
      </select>
      <button id="fetchCloudModelsBtn" class="btn-secondary" type="button">Çek</button>
    </div>
    <input type="text" id="customModelInput" placeholder="Manuel model adı girin" style="margin-top: 6px;">
  </div>

  <!-- Button Visibility Setting -->
  <div class="checkbox-group">
    <input type="checkbox" id="showButtonCheckbox" checked>
    <label for="showButtonCheckbox">Button Visible (Sayfada Buton Göster)</label>
  </div>

  <button id="saveBtn" class="btn-primary">Ayarları Kaydet</button>

  <div class="shortcut-info">
    ⚡ Kısayol: <kbd>Ctrl</kbd> + <kbd>Y</kbd>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
